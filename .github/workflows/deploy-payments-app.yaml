name: Deploy (payments-app)

on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy
    uses: pagopa/dx/.github/workflows/release-azure-appsvc-v1.yaml@49cb83094d0f5b7fa206ef7242ef48135d61c82d
    secrets: inherit
    with:
      workspace_name: io-ipatente-payments
      environment: app-prod
      resource_group_name: io-p-itn-ipatente-rg-01
      web_app_name: io-p-itn-ipatente-payments-app-01
      disable_auto_staging_deploy: true
    permissions:
      attestations: write
      contents: read
      id-token: write
